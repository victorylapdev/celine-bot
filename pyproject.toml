[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celine-assistant"
version = "0.1.0"
description = "Celine personal technology assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
