[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celine-assistant"
version = "0.1.0"
description = "Celine personal technology assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.60,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
celine = "celine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires an external PostgreSQL instance with pgvector",
]

[tool.ruff]
target-version = "py312"
line-length = 100
